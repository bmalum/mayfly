AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  IAM role assumed by the mayfly "Layers" GitHub Actions workflow through OIDC
  to publish and share Lambda layers. Deploy once in the account that owns the
  public layers:

    aws cloudformation deploy --stack-name mayfly-layers-publisher \
      --template-file layer/publisher-role.yml --capabilities CAPABILITY_NAMED_IAM \
      --parameter-overrides GitHubRepo=bmalum/mayfly

  Then set the output RoleArn as the repository secret LAYERS_ROLE_ARN.

Parameters:
  GitHubRepo:
    Type: String
    Default: bmalum/mayfly
    Description: owner/repo allowed to assume the role
  GitHubRef:
    Type: String
    Default: refs/heads/main
    Description: git ref allowed to publish (branch or tag pattern)
  LayerNamePrefix:
    Type: String
    Default: mayfly-erlang
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: set to "false" if token.actions.githubusercontent.com already exists in this account

  SmokeTests:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      also create an execution role and allow the publisher to create/invoke/delete
      throwaway mayfly-smoke-* functions, so layers.yml can deploy and invoke a test
      function per OTP/arch after publishing (set the output SmokeRoleArn as GitHub
      variable LAYERS_SMOKE_ROLE_ARN)

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]
  WithSmoke: !Equals [!Ref SmokeTests, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [ffffffffffffffffffffffffffffffffffffffff]

  PublisherRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: mayfly-layers-publisher
      Description: Publishes Mayfly ERTS layers from GitHub Actions
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:ref:${GitHubRef}
      Policies:
        - PolicyName: publish-layers
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:PublishLayerVersion
                  - lambda:ListLayerVersions
                  - lambda:GetLayerVersion
                  - lambda:AddLayerVersionPermission
                  - lambda:GetLayerVersionPolicy
                Resource:
                  - !Sub arn:aws:lambda:*:${AWS::AccountId}:layer:${LayerNamePrefix}-*
                  - !Sub arn:aws:lambda:*:${AWS::AccountId}:layer:mayfly-shutdown-*
        - !If
          - WithSmoke
          - PolicyName: smoke-functions
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - lambda:CreateFunction
                    - lambda:GetFunction
                    - lambda:GetFunctionConfiguration
                    - lambda:InvokeFunction
                    - lambda:DeleteFunction
                    - lambda:TagResource
                  Resource: !Sub arn:aws:lambda:*:${AWS::AccountId}:function:mayfly-smoke-*
                - Effect: Allow
                  Action: iam:PassRole
                  Resource: !GetAtt SmokeExecutionRole.Arn
          - !Ref AWS::NoValue

  SmokeExecutionRole:
    Type: AWS::IAM::Role
    Condition: WithSmoke
    Properties:
      RoleName: mayfly-smoke-lambda-role
      Description: Execution role for throwaway layer smoke-test functions
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

Outputs:
  SmokeRoleArn:
    Condition: WithSmoke
    Value: !GetAtt SmokeExecutionRole.Arn
    Description: set as GitHub variable LAYERS_SMOKE_ROLE_ARN to enable the smoke job
  RoleArn:
    Value: !GetAtt PublisherRole.Arn
    Description: set as GitHub secret LAYERS_ROLE_ARN
