AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Elixir on AWS Lambda with Mayfly (https://elixir-aws-lambda.dev)

# Layer ARNs below are rendered from https://elixir-aws-lambda.dev/layers/index.json
# by layer/render-templates.sh in the mayfly repository. Edit between the markers
# only if you publish your own layers.
#
# Layout: template.yaml, samconfig.toml and Makefile sit in the Mix project root
# (SAM requires the Makefile inside CodeUri). `sam build` copies the project and
# runs the Makefile target, which builds the release with `mix release` (no
# Docker: the Erlang runtime comes from the layer).

Parameters:
  FunctionName:
    Type: String
    Default: __FUNCTION_NAME__
  Handler:
    Type: String
    Default: __HANDLER__
    Description: Module implementing Mayfly.Handler (the Lambda handler string)
  Architecture:
    Type: String
    Default: __ARCH__
    AllowedValues: [arm64, x86_64]
  OtpMajor:
    Type: String
    Default: "__OTP__"
    AllowedValues: ["27", "28", "29"]
    Description: Must match the OTP major your release was built with (bootstrap verifies the exact version)
  MemorySize:
    Type: Number
    Default: 512
  Timeout:
    Type: Number
    Default: 30
  FunctionUrlInvokeMode:
    Type: String
    Default: BUFFERED
    AllowedValues: [BUFFERED, RESPONSE_STREAM]
  FunctionUrlAuthType:
    Type: String
    Default: AWS_IAM
    AllowedValues: [AWS_IAM, NONE]
  LogRetentionDays:
    Type: Number
    Default: 14

Conditions:
  IsArm64: !Equals [!Ref Architecture, arm64]
  Otp27: !Equals [!Ref OtpMajor, "27"]
  Otp28: !Equals [!Ref OtpMajor, "28"]

Mappings:
  # Second-level keys are otp<major><arch>, x86_64 written as x8664 (mapping keys must be alphanumeric).
  # mayfly-layers:begin (generated 2026-10-06 from the Mayfly catalog)
  MayflyLayers:
    ap-northeast-1:
      otp27arm64: arn:aws:lambda:ap-northeast-1:651236577491:layer:mayfly-erlang-27-3-4-18-arm64:4
