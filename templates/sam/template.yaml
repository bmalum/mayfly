Resources:
  Function:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: !Ref FunctionName
      CodeUri: .
      Handler: !Ref Handler
      Runtime: provided.al2023
      Architectures: [!Ref Architecture]
      MemorySize: !Ref MemorySize
      Timeout: !Ref Timeout
      Layers:
        - !If
          - IsArm64
          - !If
            - Otp27
            - !FindInMap [MayflyLayers, !Ref AWS::Region, otp27arm64]
            - !If
              - Otp28
              - !FindInMap [MayflyLayers, !Ref AWS::Region, otp28arm64]
              - !FindInMap [MayflyLayers, !Ref AWS::Region, otp29arm64]
          - !If
            - Otp27
            - !FindInMap [MayflyLayers, !Ref AWS::Region, otp27x8664]
            - !If
              - Otp28
              - !FindInMap [MayflyLayers, !Ref AWS::Region, otp28x8664]
              - !FindInMap [MayflyLayers, !Ref AWS::Region, otp29x8664]
      LoggingConfig:
        LogFormat: JSON
        LogGroup: !Ref LogGroup
      Tracing: Active
      FunctionUrlConfig:
        AuthType: !Ref FunctionUrlAuthType
        InvokeMode: !Ref FunctionUrlInvokeMode
      Environment:
        Variables:
          LOGLEVEL: info

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${FunctionName}
      RetentionInDays: !Ref LogRetentionDays

Outputs:
  FunctionArn:
    Value: !GetAtt Function.Arn
  FunctionUrl:
    Value: !GetAtt FunctionUrl.FunctionUrl
  LayerArn:
    Value: !If
      - IsArm64
      - !If
        - Otp27
        - !FindInMap [MayflyLayers, !Ref AWS::Region, otp27arm64]
        - !If
          - Otp28
          - !FindInMap [MayflyLayers, !Ref AWS::Region, otp28arm64]
          - !FindInMap [MayflyLayers, !Ref AWS::Region, otp29arm64]
      - !If
        - Otp27
        - !FindInMap [MayflyLayers, !Ref AWS::Region, otp27x8664]
        - !If
          - Otp28
          - !FindInMap [MayflyLayers, !Ref AWS::Region, otp28x8664]
          - !FindInMap [MayflyLayers, !Ref AWS::Region, otp29x8664]
