# Builds and publishes the Mayfly ERTS layers.
#
# - Runs weekly (picks up new OTP patch releases automatically) and on demand.
# - Builds each OTP version natively per architecture (no QEMU): ubuntu-24.04
#   for x86_64, ubuntu-24.04-arm for arm64.
# - Publishes to every region in the list under a pinned name and a major
#   alias, idempotently (already-published versions are reused), then attaches
#   ARNS.md / arns.json / checksums to the GitHub release "layers".
#
# Required repository configuration:
#   secrets.LAYERS_ROLE_ARN   IAM role trusted by GitHub OIDC with
#                             lambda:PublishLayerVersion, lambda:ListLayerVersions,
#                             lambda:AddLayerVersionPermission
#   vars.LAYERS_REGIONS       space separated regions (optional, see default)
#   vars.LAYERS_OTP_MAJORS    e.g. "27 28" (optional)
#   secrets.WEBSITE_DEPLOY_KEY  SSH private key with write access to the
#                             mayfly_website repo (optional; enables the
#                             catalog update at elixir-aws-lambda.dev/layers)
name: Layers

on:
  workflow_dispatch:
    inputs:
      otp_versions:
        description: "OTP versions (space separated). Empty = latest patch of each configured major."
        default: ""
      public:
        description: "Grant public lambda:GetLayerVersion"
        type: boolean
        default: true
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write
  id-token: write

env:
  DEFAULT_REGIONS: >-
    eu-central-1 eu-west-1 eu-west-2 eu-west-3 eu-north-1
    us-east-1 us-east-2 us-west-1 us-west-2 ca-central-1 sa-east-1
    ap-southeast-1 ap-southeast-2 ap-northeast-1 ap-northeast-2 ap-south-1

jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      otps: ${{ steps.resolve.outputs.otps }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.otp_versions }}" ]; then
            list="${{ inputs.otp_versions }}"
          else
            list="$(layer/latest-otp.sh ${{ vars.LAYERS_OTP_MAJORS || '27 28' }} | tr '\n' ' ')"
          fi
          echo "otps=$(printf '%s' "$list" | jq -R -c 'split(" ") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"
          echo "Building OTP: $list"

  build:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        otp: ${{ fromJson(needs.versions.outputs.otps) }}
        arch: [x86_64, arm64]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: layer/build.sh --otp "${{ matrix.otp }}" --arch "${{ matrix.arch }}"
      - name: Smoke test the layer (crypto + ssl start on AL2023)
        run: |
          docker run --rm -v "$PWD/layer/dist:/dist:ro" amazonlinux:2023 sh -c '
            dnf install -y -q unzip >/dev/null && unzip -q /dist/mayfly-erlang-${{ matrix.otp }}-${{ matrix.arch }}.zip -d /opt &&
            /opt/erlang/bin/erl -noshell -eval "{ok,_}=application:ensure_all_started(ssl), io:format(\"ok ~s~n\",[erlang:system_info(otp_release)]), halt()."'
      - uses: actions/upload-artifact@v4
        with:
          name: layer-${{ matrix.otp }}-${{ matrix.arch }}
          path: |
            layer/dist/*.zip
            layer/dist/*.sha256
          if-no-files-found: error

  publish:
    needs: [versions, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: layer-*
          path: layer/dist
          merge-multiple: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.LAYERS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Publish to all regions
        run: |
          args=(--skip-existing)
          [ "${{ inputs.public }}" != "false" ] && args+=(--public)
          for r in ${{ vars.LAYERS_REGIONS || env.DEFAULT_REGIONS }}; do args+=(--region "$r"); done
          layer/publish.sh "${args[@]}"
          { echo "## Mayfly ERTS layers"; echo; cat layer/dist/ARNS.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Attach to the 'layers' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view layers >/dev/null 2>&1 || gh release create layers --title "Mayfly ERTS layers" \
            --notes "Public Lambda layers with Erlang/OTP for Mayfly. See ARNS.md. Rebuilt weekly for the latest OTP patch releases."
          gh release upload layers --clobber layer/dist/ARNS.md layer/dist/arns.json layer/dist/*.sha256

      - name: Update the layer catalog on elixir-aws-lambda.dev
        if: env.HAVE_KEY == 'true'
        env:
          HAVE_KEY: ${{ secrets.WEBSITE_DEPLOY_KEY != '' }}
          DEPLOY_KEY: ${{ secrets.WEBSITE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/website_key && chmod 600 ~/.ssh/website_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/website_key -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:bmalum/mayfly_website.git /tmp/site
          mkdir -p /tmp/site/data
          # Merge: keep previously published versions, override/add the ones from this run.
          python3 - <<'PY'
          import json, pathlib
          site = pathlib.Path("/tmp/site/data/layers.json")
          old = json.loads(site.read_text()) if site.exists() else []
          new = json.load(open("layer/dist/arns.json"))
          key = lambda e: (e["region"], e["otp"], e["arch"])
          merged = {key(e): e for e in old}
          merged.update({key(e): e for e in new})
          site.write_text(json.dumps(sorted(merged.values(), key=key), indent=2) + "\n")
          pathlib.Path("/tmp/site/data/layers.updated").write_text(__import__("datetime").datetime.now(__import__("datetime").timezone.utc).strftime("%Y-%m-%d") + "\n")
          print(len(merged), "layer entries")
          PY
          cd /tmp/site
          git config user.name "mayfly-layers-bot" && git config user.email "layers@elixir-aws-lambda.dev"
          git add data && git diff --cached --quiet && { echo "catalog unchanged"; exit 0; }
          git commit -m "layers: update catalog ($(date -u +%F))" && git push

      - name: Render layer ARN maps into the IaC templates
        if: env.HAVE_KEY == 'true'
        env:
          HAVE_KEY: ${{ secrets.WEBSITE_DEPLOY_KEY != '' }}
        run: |
          # Uses the merged catalog from the website checkout (all published versions).
          layer/render-templates.sh /tmp/site/data/layers.json | tee render.log
          grep -q '^changed$' render.log || { echo "templates unchanged"; exit 0; }
          git config user.name "mayfly-layers-bot" && git config user.email "layers@elixir-aws-lambda.dev"
          git add templates
          git commit -m "templates: layer ARNs from catalog ($(date -u +%F))"
          git push origin HEAD:${{ github.ref_name }}

  # The mayfly-shutdown external extension (tiny static binary, one zip per arch).
  # Published alongside the ERTS layers; version descriptions carry the sha256,
  # so unchanged source publishes nothing.
  shutdown-extension:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }
      - run: layer/build-shutdown-extension.sh --arch x86_64 && layer/build-shutdown-extension.sh --arch arm64
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.LAYERS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Publish to all regions
        run: |
          args=(--skip-existing)
          [ "${{ inputs.public }}" != "false" ] && args+=(--public)
          for r in ${{ vars.LAYERS_REGIONS || env.DEFAULT_REGIONS }}; do args+=(--region "$r"); done
          layer/publish-shutdown.sh "${args[@]}"
      - name: Attach to the 'layers' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload layers --clobber layer/dist/shutdown-arns.json layer/dist/mayfly-shutdown-*.zip.sha256
      - name: Update the catalog on elixir-aws-lambda.dev
        if: env.HAVE_KEY == 'true'
        env:
          HAVE_KEY: ${{ secrets.WEBSITE_DEPLOY_KEY != '' }}
          DEPLOY_KEY: ${{ secrets.WEBSITE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/website_key && chmod 600 ~/.ssh/website_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/website_key -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:bmalum/mayfly_website.git /tmp/site
          mkdir -p /tmp/site/data && cp layer/dist/shutdown-arns.json /tmp/site/data/shutdown-layers.json
          cd /tmp/site && git config user.name "mayfly-layers-bot" && git config user.email "layers@elixir-aws-lambda.dev"
          git add data && git diff --cached --quiet && { echo "unchanged"; exit 0; }
          git commit -m "layers: update shutdown extension catalog ($(date -u +%F))" && git push

  # End-to-end smoke test of the published layers: for every OTP major and
  # architecture, build a tiny Mayfly release with that exact OTP, deploy it with
  # the just-published layer, invoke it, and delete it. Opt-in: requires the
  # execution role in vars.LAYERS_SMOKE_ROLE_ARN (see layer/publisher-role.yml,
  # parameter SmokeTests=true) in the same account as the layers.
  smoke:
    needs: [versions, publish]
    if: vars.LAYERS_SMOKE_ROLE_ARN != ''
    strategy:
      fail-fast: false
      matrix:
        otp: ${{ fromJson(needs.versions.outputs.otps) }}
        arch: [x86_64, arm64]
    runs-on: ubuntu-24.04
    env:
      AWS_REGION: ${{ vars.LAYERS_SMOKE_REGION || 'eu-central-1' }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick the Elixir release for this OTP major
        id: elixir
        run: |
          major="${{ matrix.otp }}"; major="${major%%.*}"
          case "$major" in
            27) echo "version=1.18.4" ;;
            28) echo "version=1.19.3" ;;
            *)  echo "version=1.20.2" ;;
          esac >> "$GITHUB_OUTPUT"
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ steps.elixir.outputs.version }}
      - name: Build a release against the layer
        run: |
          mix deps.get
          MIX_ENV=test mix release lambda --overwrite
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.LAYERS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy, invoke, delete
        run: |
          arch="${{ matrix.arch }}"; otp="${{ matrix.otp }}"
          fn="mayfly-smoke-${otp//./-}-${arch}-${GITHUB_RUN_ID}"
          layer="$(jq -r --arg r "$AWS_REGION" --arg o "$otp" --arg a "$arch" \
            '.[] | select(.region==$r and .otp==$o and .arch==$a) | .arn' layer/dist/arns.json)"
          test -n "$layer" || { echo "no layer ARN for $otp/$arch in $AWS_REGION"; exit 1; }
          trap 'aws lambda delete-function --function-name "$fn" >/dev/null 2>&1 || true' EXIT
          aws lambda create-function --function-name "$fn" --runtime provided.al2023 \
            --architectures "$arch" --handler Mayfly.Test.Handlers.Faulty --layers "$layer" \
            --zip-file fileb://_build/test/rel/lambda/lambda.zip \
            --role "${{ vars.LAYERS_SMOKE_ROLE_ARN }}" --timeout 30 --memory-size 512 \
            --logging-config LogFormat=JSON --tags project=mayfly,purpose=smoke >/dev/null
          aws lambda wait function-active-v2 --function-name "$fn"
          aws lambda invoke --function-name "$fn" --cli-binary-format raw-in-base64-out \
            --payload '{"smoke":true}' out.json --query FunctionError --output text | grep -q None
          grep -q '"smoke":true' out.json
          aws lambda invoke --function-name "$fn" --cli-binary-format raw-in-base64-out \
            --payload '{"mode":"raise"}' err.json --query FunctionError --output text | grep -q Unhandled
          grep -q '"errorType":"ArgumentError"' err.json
          echo "ok: $otp on $arch with $layer"

