# Publishes the package to Hex.pm when a version tag is pushed.
#
#   git tag v1.0.0 && git push --tags
#
# Requires the repository secret HEX_API_KEY (mix hex.user key generate
# --permission api:write). The tag must equal "v" + @version in mix.exs.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  hex:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3"
      - run: mix deps.get
      - name: Check tag matches mix.exs version
        run: |
          v="$(mix run --no-start -e 'IO.puts Mix.Project.config()[:version]')"
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$v" >&2; exit 1; }
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: mix docs
      - name: Build the package and refuse anything suspiciously large (artefacts leaking in)
        run: |
          mix hex.build
          size=$(stat -c %s mayfly-*.tar)
          echo "package size: $size bytes"
          test "$size" -lt 2000000 || { echo "package larger than 2 MB: a build artefact is being shipped"; tar tf mayfly-*.tar | head -50; exit 1; }
          tar tf mayfly-*.tar | grep -qE "^layer/dist|^priv/plts|skills/mayfly-maintainer" && { echo "forbidden path in package"; exit 1; } || true
      - run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(awk -v tag="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" tag "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md)"
          gh release create "${GITHUB_REF_NAME}" --title "Mayfly ${GITHUB_REF_NAME}" --notes "${notes:-See CHANGELOG.md}" \
            $( [[ "${GITHUB_REF_NAME}" == *-* ]] && echo --prerelease )
